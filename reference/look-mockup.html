<title>Synapse GP Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D stadium, HUD pinned to the four corners like a race broadcast.
   Single committed look: a dark broadcast HUD over a sunlit stadium, in either host theme. */
:root {
  --ink: #070b18;
  --glass: rgba(9, 13, 30, 0.68);
  --glass-edge: rgba(150, 180, 255, 0.2);
  --text: #f1f5ff;
  --muted: #95a2c6;
  --volt: #ffc21a;
  --plus: #2fe6ff;
  --minus: #ff3d7f;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); overflow: hidden; font-family: var(--display); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#hud {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  gap: 12px;
}
.top, .bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.bottom { align-items: flex-end; }

.brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.logo { font-weight: 700; font-style: italic; font-size: 26px; letter-spacing: 0.02em; line-height: 1; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
.logo b { color: var(--ink); background: var(--volt); padding: 0 8px 0 6px; margin-left: 6px; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }
.phase { display: inline-flex; align-items: stretch; background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); width: max-content; max-width: 100%; }
.phase > span { padding: 6px 10px; display: flex; align-items: center; white-space: nowrap; }
.phase-name { background: var(--volt); color: var(--ink); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 13px; }
.phase-name.train { background: var(--plus); }
.phase-meta { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
.phase-time { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; border-left: 1px solid var(--glass-edge); }

.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; pointer-events: auto; min-width: 0; }
.board li { display: grid; grid-template-columns: 26px 6px 1fr auto; align-items: center; gap: 8px; padding: 5px 12px 5px 8px; background: var(--glass); border: 1px solid transparent; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; width: 236px; transition: border-color .15s; }
.board li:hover { border-color: var(--glass-edge); }
.board li.focus { border-color: var(--volt); }
.board .pos { font-weight: 700; font-style: italic; font-size: 18px; text-align: center; }
.board .sw { width: 6px; height: 18px; transform: skewX(-14deg); }
.board .nm { font-weight: 600; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board .gap { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.board.hide { visibility: hidden; }

.controls { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.seg .lbl { color: var(--muted); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 0 8px 0 10px; display: flex; align-items: center; }
.seg button { font: 600 13px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); background: transparent; border: 0; padding: 9px 11px; cursor: pointer; }
.seg button:hover { background: rgba(255,255,255,.07); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.seg button:focus-visible, .board li:focus-visible, input:focus-visible { outline: 2px solid var(--volt); outline-offset: 1px; }
.load { display: inline-flex; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--glass-edge); padding: 6px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.load span { color: var(--muted); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
.load input { width: 150px; accent-color: var(--volt); }
.load output { font-family: var(--mono); font-size: 13px; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.load output.over { color: var(--minus); }
.hint { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; background: var(--glass); padding: 5px 10px; width: max-content; max-width: 100%; }

.brain { pointer-events: auto; width: 330px; max-width: 100%; background: var(--glass); border: 1px solid var(--glass-edge); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.brain-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.brain-head strong { font-weight: 700; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
.chip { font: 600 11px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 7px; background: var(--minus); color: var(--ink); }
#brainCv { width: 100%; height: 150px; display: block; }
.energy { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.bar { position: relative; height: 8px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--plus); }
.bar i.over { background: linear-gradient(90deg, var(--plus) 0 50%, var(--minus) 50% 100%); background-size: 200% 100%; }
.bar em { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
.energy span { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); color: var(--muted); font: 600 14px var(--display); letter-spacing: 0.14em; text-transform: uppercase; z-index: 5; transition: opacity .5s; }
#loading.done { opacity: 0; pointer-events: none; }

@media (max-width: 1100px) { .hint { display: none; } }
@media (max-width: 720px) {
  .logo { font-size: 20px; }
  .board li { width: 168px; grid-template-columns: 18px 5px 1fr; padding: 4px 8px 4px 6px; gap: 6px; }
  .board .gap { display: none; }
  .board .pos { font-size: 14px; }
  .board .nm { font-size: 12px; }
  .bottom { flex-direction: column; align-items: stretch; }
  .brain { width: 100%; }
  #brainCv { height: 110px; }
  .load input { width: 110px; }
  .hint { display: none; }
}
@media (max-width: 420px) {
  .seg .lbl { display: none; }
  .phase > span { padding: 5px 7px; font-size: 12px; }
  .logo { font-size: 18px; }
  .seg button { padding: 8px 8px; font-size: 12px; }
  .board li { width: 140px; }
}
</style>

<canvas id="scene" aria-label="3D race track with five AI-driven cars"></canvas>
<div id="loading">Building the stadium</div>
<div id="hud">
  <header class="top">
    <div class="brand">
      <div class="logo">SYNAPSE<b>GP</b></div>
      <div class="phase" aria-live="polite">
        <span class="phase-name" id="phaseName">Compete</span>
        <span class="phase-meta" id="phaseMeta">Round 3 / 5</span>

      </div>
    </div>
    <ol class="board" id="board" aria-label="Race standings"></ol>
  </header>
  <footer class="bottom">
    <div class="controls">

        <div class="seg" role="group" aria-label="Camera">

          <button type="button" id="cam-orbit" data-cam="orbit" aria-pressed="false">Showroom</button>

          <button type="button" id="ray-all" data-rays="all" aria-pressed="false">All</button>
        </div>
        <label class="load" for="load">
          <span>Your brain load</span>
          <input type="range" id="load" min="40" max="200" step="1" value="85">
          <output id="loadOut" for="load">85%</output>
        </label>
      </div>
      <div class="hint">Click a racer to follow them. Push brain load past 100% to see static. Keys 1–4 switch cameras.</div>
    </div>
    <section class="brain" aria-label="Live brain view">
      <div class="brain-head">
        <strong id="brainName">You · brain</strong>
        <span class="chip" id="staticChip" hidden>Static 0%</span>
      </div>
      <canvas id="brainCv"></canvas>
      <div class="energy">
        <div class="bar"><i id="energyFill"></i><em title="Budget"></em></div>
        <span id="energyTxt">17.0 / 20.0 E/tick</span>
      </div>
    </section>
  </footer>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261030);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function hash2(x, y) { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);

// ---------- renderer + post ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: false, powerPreference: 'high-performance' });
} catch (e) {

  throw e;
}
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);

renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 4000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const rt = new THREE.WebGLRenderTarget(innerWidth * PR, innerHeight * PR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(PR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.45, 1.3);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- sky, fog, light ----------
const FOG = new THREE.Color('#bcd4f2');
scene.fog = new THREE.Fog(FOG, 420, 1600);
const sunDir = new THREE.Vector3(0.62, 0.36, -0.42).normalize();
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1900, 32, 16), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color('#1847c4') }, mid: { value: new THREE.Color('#4f9cff') },
      horizon: { value: FOG.clone() }, sunCol: { value: new THREE.Color('#ffe6c2') }, sunDir: { value: sunDir },
    },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top, mid, horizon, sunCol, sunDir; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = d.y;
        vec3 c = mix(horizon, mid, smoothstep(-0.02, 0.2, h));
        c = mix(c, top, smoothstep(0.18, 0.8, h));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        c += sunCol * (pow(s, 1400.0) * 9.0 + pow(s, 40.0) * 0.35 + pow(s, 4.0) * 0.12);
        gl_FragColor = vec4(c, 1.0); }`,
  }));
  sky.renderOrder = -1;
  scene.add(sky);
}
scene.add(new THREE.HemisphereLight('#cfe2ff', '#3f6f45', 0.55));
const sun = new THREE.DirectionalLight('#fff0dc', 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
const SC_NEAR = 75, SC_FAR = 160;
function setShadowExtent(e) { const c = sun.shadow.camera; c.left = -e; c.right = e; c.top = e; c.bottom = -e; c.near = 1; c.far = 900; c.updateProjectionMatrix(); }
setShadowExtent(SC_NEAR);
scene.add(sun, sun.target);

// ---------- canvas textures ----------
function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
await Promise.race([
  Promise.all([document.fonts.load('italic 700 64px "Chakra Petch"'), document.fonts.load('600 64px "Chakra Petch"')]),
  new Promise((r) => setTimeout(r, 2500)),
]).catch(() => {});

const roadTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#3c4458'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 14000; i++) {
    const v = rand(); g.fillStyle = v > 0.5 ? `rgba(255,255,255,${0.03 + rand() * 0.07})` : `rgba(0,0,0,${0.05 + rand() * 0.1})`;
    g.fillRect(rand() * w, rand() * h, 1 + rand() * 1.5, 1 + rand() * 1.5);
  }
  // stadium-block seams
  for (const y of [0, 256]) { g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(0, y, w, 3); g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, y + 3, w, 2); }
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(w / 2 - 1, 0, 2, h);
  // edge lines
  g.fillStyle = '#f4f7ff'; g.fillRect(14, 0, 12, h); g.fillRect(w - 26, 0, 12, h);
  // centre dashes
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(w / 2 - 4, 40, 8, 120); g.fillRect(w / 2 - 4, 296, 8, 120);
}, true);

const checkerTex = canvasTex(512, 64, (g, w, h) => {
  const s = 32; for (let y = 0; y < h / s; y++) for (let x = 0; x < w / s; x++) { g.fillStyle = (x + y) % 2 ? '#0d1020' : '#f6f8ff'; g.fillRect(x * s, y * s, s, s); }
});
const boostTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#1b0d02'; g.fillRect(0, 0, w, h);
  const grad = g.createLinearGradient(0, h, 0, 0); grad.addColorStop(0, '#ff6a1a'); grad.addColorStop(1, '#ffd21a');
  g.fillStyle = grad;
  for (let k = 0; k < 2; k++) {
    const y = k * 128 + 20; g.beginPath();
    g.moveTo(30, y + 90); g.lineTo(128, y); g.lineTo(226, y + 90); g.lineTo(226, y + 118); g.lineTo(128, y + 34); g.lineTo(30, y + 118); g.closePath(); g.fill();
  }
}, true);
const chevronTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#ffcf1f'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#0d1020';
  for (let k = 0; k < 3; k++) { const x = 24 + k * 76; g.beginPath(); g.moveTo(x, 18); g.lineTo(x + 30, 18); g.lineTo(x + 70, 64); g.lineTo(x + 30, 110); g.lineTo(x, 110); g.lineTo(x + 40, 64); g.closePath(); g.fill(); }

});
const glowTex = canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.45, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
function bannerTex(text, sub, bg1, bg2, fg = '#ffffff') {
  return canvasTex(1024, 320, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, bg1); gr.addColorStop(1, bg2);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.08)'; for (let x = -h; x < w; x += 48) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + h, 0); g.lineTo(x + h + 16, 0); g.lineTo(x + 16, h); g.fill(); }

  });
}
function gateTex(label) {
  return canvasTex(1024, 128, (g, w, h) => {
    g.fillStyle = '#0d1020'; g.fillRect(0, 0, w, h);
    const s = 16; for (let y = 0; y < 2; y++) for (let x = 0; x < w / s; x++) { g.fillStyle = (x + y) % 2 ? '#0d1020' : '#f6f8ff'; g.fillRect(x * s, y * s, s, s); g.fillRect(x * s, h - (2 - y) * s, s, s); }

    g.fillText(label, w / 2, h / 2 + 2);
  });
}
const lampTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#20263a'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < 3; y++) for (let x = 0; x < 6; x++) {
    const cx = 24 + x * 42, cy = 24 + y * 40;
    const r = g.createRadialGradient(cx, cy, 0, cx, cy, 18); r.addColorStop(0, '#ffffff'); r.addColorStop(0.6, '#fff4d6'); r.addColorStop(1, '#5a5a66');
    g.fillStyle = r; g.beginPath(); g.arc(cx, cy, 16, 0, Math.PI * 2); g.fill();
  }

// ---------- track centreline ----------
const SCALE = 1.25;
const ctrl = [[-150, 120], [-50, 122], [50, 120], [120, 112], [180, 70], [200, -10], [175, -85], [115, -100], [75, -55], [25, -25], [-20, -60], [-40, -130], [-100, -165], [-170, -125], [-205, -45], [-195, 40]]
  .map(([x, z]) => new THREE.Vector3(x * SCALE, 0, z * SCALE));
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
const N = 1000;
const L = curve.getLength();
const ds = L / N;
// start line sits mid-way down the main straight
let u0 = 0; { let best = 1e9; const want = new THREE.Vector2(-70 * SCALE, 121 * SCALE); for (let i = 0; i < 400; i++) { const p = curve.getPointAt(i / 400); const d = (p.x - want.x) ** 2 + (p.z - want.y) ** 2; if (d < best) { best = d; u0 = i / 400; } } }
const P = [], T = [];
for (let i = 0; i < N; i++) P.push(curve.getPointAt((u0 + i / N) % 1));

    const showRays = rayMode === 'all' || (rayMode === 'focus' && c.k === focusK);
    const visible = c.car.visible;
    const fx = c.fwd.x, fz = c.fwd.z, fl = Math.hypot(fx, fz) || 1;
    const ox = c.pos.x + fx / fl * 2.3, oz = c.pos.z + fz / fl * 2.3, oy = c.pos.y + 0.75;
    RAY_ANG.forEach((a0, r) => {
      const a = a0 + (c.k === 0 ? (Math.random() - 0.5) * 0.7 * noiseA : 0);
      const dx = (fx * Math.cos(a) - fz * Math.sin(a)) / fl, dz = (fx * Math.sin(a) + fz * Math.cos(a)) / fl;
      const d = castRay(ox, oz, dx, dz, idx);
      c.rays[r] = d;
      const b = c.beams[r];
      b.beam.visible = b.hit.visible = showRays && visible;
      if (!b.beam.visible) return;
      const act = 1 - d / RAY_MAX;
      b.beam.position.set(ox, oy, oz);
      tmpV.set(ox + dx * d, oy, oz + dz * d);
      b.beam.lookAt(tmpV); b.beam.scale.set(1, 1, d);
      b.hit.position.copy(tmpV); b.hit.rotation.y = t * 3; b.hit.visible = d < RAY_MAX - 0.5;
      const flick = c.k === 0 ? 1 - noiseA * Math.random() : 1;
      b.mat.opacity = (rayMode === 'all' && c.k !== focusK ? 0.25 : 0.35 + act * 0.65) * flick;
    });
  }
}

function updateGhosts(dt, t) {
  const elite = cars[0];
  ghosts.forEach((g, n) => {
    if (!g.alive) { g.fade -= dt * 2; if (g.fade <= 0) spawnGhost(g, elite.s); }
    else {
      g.life += dt;
      g.offV += (rand() - 0.5) * dt * 26 - g.off * 0.25 * dt;
      g.off += g.offV * dt;
      const idx = Math.floor(((g.s / ds) % N + N) % N);
      g.v += ((50 + (n % 7) * 2) * (1 - 0.35 * smooth(0.004, 0.03, Math.abs(KA[idx]))) - g.v) * dt;
      g.s += g.v * dt;
      if (Math.abs(g.off) > 10.6 || g.life > 9 + (n % 5)) { g.alive = false; g.fade = 1; }
    }
    poseAt(g.s, g.off, Math.atan(g.offV / Math.max(g.v, 1)), tmpV, tmpQ);
    const sc = g.alive ? 1 : Math.max(g.fade, 0.001);
    _m4.compose(tmpV, tmpQ, _s.set(sc, sc, sc));
    ghostMesh.setMatrixAt(n, _m4);
    const life = g.alive ? smooth(0, 0.5, g.life) : g.fade;
    ghostTint.setRGB(0.45, 1.5, 2.2).multiplyScalar(0.55 * life);
    if (!g.alive) ghostTint.setRGB(1.2 * g.fade, 0.25 * g.fade, 0.35 * g.fade);
    ghostMesh.setColorAt(n, ghostTint);
  });
  ghostMesh.instanceMatrix.needsUpdate = true;
  if (ghostMesh.instanceColor) ghostMesh.instanceColor.needsUpdate = true;
}

function updateCamera(dt, t) {
  const c = cars[focusK];
  const k = snapCam ? 1 : 1 - Math.exp(-dt * 5);
  if (camMode === 'chase') {
    const desired = tmpV.copy(c.pos).addScaledVector(c.fwd, -10.5); desired.y = c.pos.y + 3.9;
    camera.position.lerp(desired, k);
    const look = _p.copy(c.pos).addScaledVector(c.fwd, 6); look.y += 1.2;
    camLook.lerp(look, snapCam ? 1 : 1 - Math.exp(-dt * 8));
    camera.lookAt(camLook);
    const fov = 60 + c.v * 0.1; if (Math.abs(camera.fov - fov) > 0.05 && !reduceMotion) { camera.fov += (fov - camera.fov) * k; camera.updateProjectionMatrix(); }
  } else if (camMode === 'tv') {
    const idx = Math.floor(((c.s / ds) % N + N) % N);
    let best = 0, bv = 1e9;
    tvSpots.forEach((sp, n) => { let rel = idx - sp.i; rel = ((rel % N) + N) % N; if (rel > N / 2) rel -= N; const score = Math.abs(rel + 12); if (score < bv) { bv = score; best = n; } });
    if (best !== tvIdx) { tvIdx = best; snapCam = true; camera.position.copy(tvSpots[best].p); }
    camLook.lerp(_p.copy(c.pos).setY(c.pos.y + 0.8), snapCam ? 1 : 1 - Math.exp(-dt * 7));
    camera.lookAt(camLook);
    const dist = camera.position.distanceTo(c.pos);
    camera.fov = clamp(2 * Math.atan(8 / dist) * 180 / Math.PI, 9, 55); camera.updateProjectionMatrix();
  } else if (camMode === 'orbit') {
    tmpV.copy(c.pos).sub(controls.target);
    camera.position.add(tmpV); controls.target.copy(c.pos);
    controls.update();
  } else {
    // hover over the swarm: elite car plus its population of ghosts
    const a = t * 0.05 + 0.6, R = 120;
    camLook.lerp(_p.copy(c.pos).lerp(centroid, 0.15), snapCam ? 1 : 1 - Math.exp(-dt * 2));
    camera.position.set(camLook.x + Math.sin(a) * R, camLook.y + 125, camLook.z + Math.cos(a) * R);
    camera.lookAt(camLook);
  }
  snapCam = false;
  // shadow box follows the action
  const focus = camMode === 'train' ? camLook : c.pos;
  sun.target.position.copy(focus); sun.position.copy(focus).addScaledVector(sunDir, 400);
}

function updateHud(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = 0.2;
  const noiseA = clamp(load - 1, 0, 1);
  if (camMode === 'train') {
    const gen = Math.min(120, 1 + Math.floor(trainT / 10 * 120));
    $('phaseMeta').textContent = `Gen ${gen} / 120`; $('phaseTime').textContent = fmt(10 - trainT);
  } else {
    $('phaseMeta').textContent = `Round ${round} / 5`; $('phaseTime').textContent = fmt(30 - raceT);
    const order = [...cars].sort((a, b) => b.total - a.total);
    const lead = order[0];
    order.forEach((c, p) => {
      const row = rows[c.k]; row.style.order = p;
      row.querySelector('.pos').textContent = p + 1;
      row.querySelector('.gap').textContent = p === 0 ? `Lap ${Math.max(1, Math.floor(lead.total / L) + 1)}` : `+${((lead.total - c.total) / Math.max(c.v, 1)).toFixed(1)}s`;
    });
  }
  const budget = 20, used = budget * load;
  $('energyTxt').textContent = `${used.toFixed(1)} / ${budget.toFixed(1)} E/tick`;
  const fill = $('energyFill'); fill.style.width = `${clamp(load / 2, 0, 1) * 100}%`; fill.classList.toggle('over', load > 1);
  const chip = $('staticChip'); chip.hidden = !(noiseA > 0 && focusK === 0); chip.textContent = `Static ${Math.round(noiseA * 100)}%`;
}

let first = true;
function frame() {
  if (window.__pause) { clock.getDelta(); requestAnimationFrame(frame); return; }
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  raceT += dt; if (raceT >= 30) { raceT = 0; round = round % 5 + 1; }
  trainT += dt; if (trainT >= 10) trainT = 0;
  updateCars(dt, t);
  if (camMode === 'train') updateGhosts(dt, t);
  updateCamera(dt, t);
  boostTex.offset.y -= dt * 1.6;
  clouds.rotation.y += dt * 0.004;
  composer.render();
  drawBrain(cars[focusK], focusK === 0 ? clamp(load - 1, 0, 1) : 0, t);
  updateHud(dt);
  if (first) { first = false; $('loading').classList.add('done'); }
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
  sizeBrain();
});
// warm the race so the opening frame shows a spread-out pack
for (let i = 0; i < 90; i++) updateCars(1 / 30, i / 30);
setCam('chase');
window.__setCam = setCam; window.__setFocus = setFocus;
requestAnimationFrame(frame);
</script>
