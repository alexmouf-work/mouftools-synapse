.info { grid-column: 1; grid-row: 1; background: var(--panel); border-right: 1px solid var(--line); display: grid; grid-template-rows: 1fr 1fr; min-width: 0; }
.scene { grid-column: 2; grid-row: 1; }
.half { display: flex; flex-direction: column; min-height: 0; padding: 7px 8px; gap: 2px; }
.half + .half { border-top: 1px solid var(--line); }
.hd { display: flex; align-items: center; gap: 6px; min-height: 22px; }
h2 { margin: 0; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.gen { margin-left: auto; font-size: 10.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.key { display: flex; gap: 10px; font-size: 10.5px; color: var(--muted); }

<div class="app" id="app">
  <div class="scene" role="img" aria-label="The training cars on the track"></div>
  <aside class="info" aria-label="Training">
    <section class="half">
      <div class="hd"><h2>Fitness</h2><span class="gen" id="gen"></span><button class="btn" type="button">Stop</button></div>
      <canvas id="fit" aria-label="Fitness per generation"></canvas>
      <div class="key"><span><i style="background:var(--accent)"></i>best</span><span><i style="background:var(--muted)"></i>mean</span></div>
    </section>
    <section class="half">
      <div class="hd"><h2>Map</h2><span class="gen" id="cars"></span></div>
      <canvas id="map" aria-label="Map with every car"></canvas>
    </section>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id), css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const GENS = 40, NCARS = 12, POP = 120;
// ---- a figure-eight track: closed curve, the second pass over the crossing is the bridge deck ----
const N = 400, TR = [];
for (let i = 0; i < N; i++) { const t = i / N * Math.PI * 2; TR.push([Math.sin(t), 0.9 * Math.sin(t) * Math.cos(t)]); }
// height along the lap: 0 on the ground, up to 1 on the deck over the crossing at t = π (render only; the sim stays flat)
const deckH = (i) => { const d = Math.abs(i / N - 0.5) * N, ramp = 40, flat = 14; return d < flat ? 1 : d < flat + ramp ? 0.5 + 0.5 * Math.cos(Math.PI * (d - flat) / ramp) : 0; };

const best = [], mean = [];
for (let g = 1; g <= GENS; g++) { const k = 1 - Math.exp(-g / 9); best.push(1450 * k + 60 * Math.sin(g * 1.7) * k); mean.push(820 * k * k + 40 * Math.sin(g * 2.3) * k); }
let shown = 14;
function size(c) { const r = c.getBoundingClientRect(), d = Math.min(devicePixelRatio, 2) * SCALE; c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); const g = c.getContext('2d'); g.scale(d, d); return { g, w: r.width, h: r.height }; }
function fitness() {
  const { g, w, h } = size($('fit')), l = 30, r = w - 6, t = 6, b = h - 26, ymax = 1600;
  const X = (v) => l + (r - l) * v / GENS, Y = (v) => b - (b - t) * v / ymax;
  g.font = '9px Arial'; g.strokeStyle = css('--line'); g.lineWidth = 1;
  for (const v of [500, 1000, 1500]) { g.beginPath(); g.moveTo(l, Y(v)); g.lineTo(r, Y(v)); g.stroke(); }
  for (const v of [10, 20, 30, 40]) { g.beginPath(); g.moveTo(X(v), t); g.lineTo(X(v), b); g.stroke(); }
  g.strokeStyle = css('--text'); g.lineWidth = 1.2; g.beginPath(); g.moveTo(l, Y(0)); g.lineTo(r, Y(0)); g.moveTo(X(0), t); g.lineTo(X(0), b); g.stroke();
  g.fillStyle = css('--muted'); g.textAlign = 'center'; for (const v of [0, 10, 20, 30, 40]) g.fillText(v, X(v), b + 11);
  g.textAlign = 'right'; for (const v of [0, 500, 1000, 1500]) g.fillText(v >= 1000 ? `${v / 1000}k` : v, l - 3, Y(v) + 3);
  g.fillStyle = css('--text'); g.textAlign = 'center'; g.fillText('generation', (l + r) / 2, b + 23);
  g.save(); g.translate(8, (t + b) / 2); g.rotate(-Math.PI / 2); g.fillText('fitness (m)', 0, 0); g.restore();

}
// ---- map: the whole track, every car, the bridge drawn over the crossing ----
let cars = [], seedN = 1, born = 0;
const rnd = () => (seedN = (seedN * 16807) % 2147483647) / 2147483647;
// a fresh random handful of the generation's agents; better generations drive faster and further
function sample(gen, now) { born = now; const q = 0.4 + 0.6 * (1 - Math.exp(-gen / 9)); cars = Array.from({ length: NCARS }, () => ({ id: 1 + Math.floor(rnd() * POP), s: 0.25, v: (0.03 + 0.03 * rnd()) * q, off: (rnd() * 2 - 1) * (1.2 - q), stop: q > 0.8 && rnd() > 0.3 ? 9 : 0.3 + rnd() * 0.8 * q })); }
const pick = 0;
function map(time) {

  const P = (p) => [w / 2 + p[0] * s, h / 2 + p[1] * s], width = 7;
  g.fillStyle = css('--canvas'); g.fillRect(0, 0, w, h);

  stroke(0, N, css('--road'), width);
  const lowerSeg = (i) => deckH(i) < 0.5;
  const drawCars = (deck) => cars.forEach((c, k) => {
    const sp = (((c.s + c.v * Math.min(time, c.stop * 10)) % 1) + 1) % 1, i = Math.floor(sp * N); if (lowerSeg(i) === deck) return;

    const [x, y] = P(a), ox = -dy / m * c.off * 3, oy = dx / m * c.off * 3;

    if (k === pick) { g.strokeStyle = css('--accent'); g.lineWidth = 1.4; g.beginPath(); g.arc(x + ox, y + oy, 7, 0, 7); g.stroke(); }
  });

  const i0 = N / 2 - 30, i1 = N / 2 + 30;
  g.save(); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 6; stroke(i0, i1, css('--deck'), width + 3); g.restore();

  drawCars(true);
  // start line
  const [fx, fy] = P(TR[N / 4]); g.fillStyle = css('--text'); g.fillRect(fx - 1, fy - width / 2 - 1, 2, width + 2);

}

function fit() { fitness(); }
addEventListener('resize', fit); fit();
