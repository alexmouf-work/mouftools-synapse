<title>Synapse Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a plain workbench. Thin top bar, a dot-grid canvas filling the screen, a narrow side panel.
   Inputs pinned to the canvas's left edge, outputs to its right; neurons go anywhere in between. */
:root {
  --bg: #eef0f3;
  --canvas: #f7f8fa;
  --dot: #d3d8e0;
  --panel: #ffffff;
  --line: #dde1e8;
  --text: #1d2330;
  --muted: #6a7385;
  --accent: #2f6fde;
  --wire: #9aa3b4;
  --plus: #2f6fde;
  --minus: #d9465b;
  --node: #ffffff;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181e; --canvas: #1a1e25; --dot: #2c323d; --panel: #20252e; --line: #2f3541; --text: #e6e9ef; --muted: #98a1b2;
  --accent: #6b9cff; --wire: #5f6879; --plus: #6b9cff; --minus: #ff7085; --node: #232933; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15181e; --canvas: #1a1e25; --dot: #2c323d; --panel: #20252e; --line: #2f3541; --text: #e6e9ef; --muted: #98a1b2;
  --accent: #6b9cff; --wire: #5f6879; --plus: #6b9cff; --minus: #ff7085; --node: #232933; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
button, select { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.word { font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.name { border: 1px solid transparent; background: none; padding: 4px 6px; font-size: 15px; color: var(--muted); border-radius: 6px; }
.name:hover { border-color: var(--line); }
.energy { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; }
.energy .bar { width: 140px; height: 6px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; }
.energy .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.energy .bar i.over { background: var(--minus); }
.energy span { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.energy span.over { color: var(--minus); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.trainer { border: 1px solid var(--line); background: var(--panel); padding: 7px 10px; border-radius: 8px; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 10px; min-height: 0; }
.board { position: relative; min-height: 420px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background: radial-gradient(var(--dot) 1.2px, transparent 1.3px) 0 0 / 22px 22px, var(--canvas); }
#net { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.palette { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 24px); }
.palette .btn { background: var(--panel); }
.hint { position: absolute; right: 12px; bottom: 14px; font-size: 12px; color: var(--muted); max-width: 46%; text-align: right; }

.side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
.side h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left; }
.row small { font-family: var(--mono); color: var(--muted); font-size: 11.5px; }
.row[aria-pressed="false"] { color: var(--muted); border-style: dashed; }
.fx { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.fx button { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.fx button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.fx svg { width: 22px; height: 14px; flex: none; }
.fx small { margin-left: auto; font-family: var(--mono); color: var(--muted); font-size: 11px; }
.note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; color: var(--minus); padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; align-self: flex-start; }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(420px, 62vh) auto; }
  .energy { margin-left: 0; width: 100%; }
  .energy .bar { flex: 1; }
  .hint { display: none; }
}
</style>

<div class="app">
  <header class="top">
    <span class="word">Synapse</span>
    <button class="name" id="name" type="button" title="Rename">Untitled brain</button>
    <div class="energy" aria-label="Energy per tick">
      <div class="bar"><i id="eFill"></i></div>
      <span id="eVal"></span>
    </div>
    <select class="trainer" id="trainer" aria-label="Trainer">
      <option>Evolution</option>
      <option disabled>Backprop (soon)</option>
      <option disabled>Actor-critic (soon)</option>
      <option disabled>A_RP (soon)</option>
    </select>
    <button class="btn primary" id="train" type="button">Train</button>
  </header>

  <main class="work">
    <div class="board">
      <svg id="net" aria-label="Brain canvas"></svg>
      <div class="palette">
        <button class="btn" id="addN" type="button">+ Neuron</button>
        <button class="btn" id="tidy" type="button">Tidy</button>
        <button class="btn" id="clear" type="button">Clear wires</button>
      </div>
      <div class="hint">Drag from a neuron's edge dot to wire it. Drag a neuron to move it. Click a wire to cut it. Double-click empty space to add a neuron.</div>
    </div>

    <aside class="side">
      <section id="sel"></section>
      <section>
        <h2>Inputs</h2>
        <div class="list" id="inputs"></div>
      </section>
      <section>
        <h2>Energy</h2>
        <dl class="kv" id="ledger"></dl>
      </section>
    </aside>
  </main>
</div>
<div id="toast" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const BUDGET = 10;
const COST = { eye: 0.6, speed: 0.3, dir: 0.6, bias: 0, fire: 0.05 };
const UP = { step: 0.2, relu: 0.25, sigmoid: 0.5, tanh: 0.5 };
const FX = {
  step: { n: 'Step', g: 'M-8 4 H0 V-4 H8', d: 'On or off. Cheapest, but has no slope, so backprop can’t learn through it.' },
  relu: { n: 'ReLU', g: 'M-8 3 H0 L8 -5', d: 'Zero below 0, a straight line above. Cheap.' },
  sigmoid: { n: 'Sigmoid', g: 'M-8 4 C-2 4 2 -4 8 -4', d: 'Smooth from 0 to 1. Dearer to compute.' },
  tanh: { n: 'Tanh', g: 'M-8 5 C-2 5 2 -5 8 -5', d: 'Smooth from −1 to 1. Dearer to compute.' },
};
// inputs and outputs come from whatever the brain is plugged into; here, the car
const ALL_INPUTS = [
  { id: 'i:e-60', label: 'Eye −60°', k: 'eye' }, { id: 'i:e-30', label: 'Eye −30°', k: 'eye' }, { id: 'i:e0', label: 'Eye 0°', k: 'eye' },
  { id: 'i:e30', label: 'Eye +30°', k: 'eye' }, { id: 'i:e60', label: 'Eye +60°', k: 'eye' }, { id: 'i:e-90', label: 'Eye −90°', k: 'eye' },
  { id: 'i:e90', label: 'Eye +90°', k: 'eye' }, { id: 'i:spd', label: 'Speed', k: 'speed' }, { id: 'i:dir', label: 'Road ahead', k: 'dir' },
  { id: 'i:bias', label: 'Bias', k: 'bias' },
];
const OUTPUTS = [{ id: 'o:steer', label: 'Steer' }, { id: 'o:gas', label: 'Throttle' }];

const S = {
  on: new Set(['i:e-60', 'i:e-30', 'i:e0', 'i:e30', 'i:e60', 'i:spd', 'i:dir', 'i:bias']),
  neurons: [], // {id, x, y, act}  x,y in 0..1 of the free area
  wires: new Set(), sel: null,
};
let nid = 1;
const nodeIds = () => [...S.on, ...S.neurons.map((n) => n.id), ...OUTPUTS.map((o) => o.id)];
function reaches(from, to) { // is there a path from → to along wires?
  const stack = [from], seen = new Set();
  while (stack.length) { const a = stack.pop(); if (a === to) return true; if (seen.has(a)) continue; seen.add(a); for (const w of S.wires) { const [x, y] = w.split('|'); if (x === a) stack.push(y); } }
  return false;
}
function canWire(a, b) {
  if (a === b || a.startsWith('o:') || b.startsWith('i:')) return false;
  if (S.wires.has(a + '|' + b)) return false;
  return !reaches(b, a); // signals only flow forward: no loops
}
function prune() { const ids = new Set(nodeIds()); for (const w of [...S.wires]) { const [a, b] = w.split('|'); if (!ids.has(a) || !ids.has(b)) S.wires.delete(w); } }

// starter: a sparse, readable brain
function starter() {
  S.neurons = [{ act: 'relu', x: .5, y: .18 }, { act: 'relu', x: .5, y: .38 }, { act: 'relu', x: .5, y: .6 }, { act: 'tanh', x: .5, y: .8 }].map((n) => ({ id: 'n' + nid++, ...n }));
  const [a, b, c, d] = S.neurons.map((n) => n.id);
  for (const w of [['i:e-60', a], ['i:e-30', a], ['i:e0', b], ['i:e30', c], ['i:e60', c], ['i:dir', b], ['i:dir', d], ['i:spd', d], ['i:bias', d],
    [a, 'o:steer'], [c, 'o:steer'], [b, 'o:steer'], [b, 'o:gas'], [d, 'o:gas']]) S.wires.add(w[0] + '|' + w[1]);
}

// ---- energy ----
function energy() {
  let sens = 0; for (const id of S.on) sens += COST[ALL_INPUTS.find((i) => i.id === id).k];
  let up = 0; for (const n of S.neurons) up += UP[n.act];
  const fire = S.wires.size * COST.fire;
  const total = sens + up + fire;
  return { sens, up, fire, total, noise: clamp(total / BUDGET - 1, 0, 1) };
}

// ---- drawing ----
const svg = $('net');
let P = new Map(), box = { w: 800, h: 500 }, drag = null;
const PAD_L = 170, PAD_R = 150, PILL = 104;
function layout() {
  const r = svg.getBoundingClientRect(); box = { w: Math.max(r.width, 320), h: Math.max(r.height, 360) };
  svg.setAttribute('viewBox', `0 0 ${box.w} ${box.h}`);
  P = new Map();
  const ins = ALL_INPUTS.filter((i) => S.on.has(i.id));
  const gap = Math.min(44, (box.h - 80) / Math.max(ins.length, 1));
  ins.forEach((i, k) => P.set(i.id, { x: 12 + PILL, y: box.h / 2 + (k - (ins.length - 1) / 2) * gap, label: i.label, side: 'in' }));
  OUTPUTS.forEach((o, k) => P.set(o.id, { x: box.w - 12 - PILL, y: box.h / 2 + (k - .5) * 64, label: o.label, side: 'out' }));
  const fx = (x) => PAD_L + x * (box.w - PAD_L - PAD_R), fy = (y) => 30 + y * (box.h - 80);
  S.neurons.forEach((n) => P.set(n.id, { x: fx(n.x), y: fy(n.y), side: 'mid', n }));
}
function render() {
  prune(); layout(); svg.innerHTML = '';
  const wg = el('g', {}, svg);
  for (const w of S.wires) {
    const [a, b] = w.split('|'); const p = P.get(a), q = P.get(b); if (!p || !q) continue;
    const x1 = p.side === 'in' ? p.x : p.x + 15, x2 = q.side === 'out' ? q.x : q.x - 15, mx = (x1 + x2) / 2;
    const d = `M ${x1} ${p.y} C ${mx} ${p.y}, ${mx} ${q.y}, ${x2} ${q.y}`;
    const hot = S.sel && (a === S.sel || b === S.sel);
    const hit = el('path', { d, stroke: 'transparent', 'stroke-width': 12, fill: 'none', style: 'cursor:pointer' }, wg);
    el('path', { d, fill: 'none', stroke: hot ? 'var(--accent)' : 'var(--wire)', 'stroke-width': hot ? 2 : 1.4, 'stroke-linecap': 'round', 'pointer-events': 'none' }, wg);
    hit.addEventListener('click', () => { S.wires.delete(w); render(); });
  }
  el('path', { id: 'ghost', d: '', fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-dasharray': '4 4', 'pointer-events': 'none' }, svg);
  for (const [id, p] of P) {
    const g = el('g', { 'data-id': id, tabindex: 0, role: 'button', 'aria-label': p.label || FX[p.n.act].n + ' neuron' }, svg);
    const sel = S.sel === id;
    if (p.side === 'mid') {
      el('circle', { cx: p.x, cy: p.y, r: 15, fill: 'var(--node)', stroke: sel ? 'var(--accent)' : 'var(--muted)', 'stroke-width': sel ? 2.5 : 1.5, style: 'cursor:move', 'data-move': id }, g);
      el('path', { d: FX[p.n.act].g, transform: `translate(${p.x} ${p.y})`, fill: 'none', stroke: 'var(--text)', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'pointer-events': 'none' }, g);
    } else {
      const rx = p.side === 'in' ? p.x - PILL : p.x;
      el('rect', { x: rx, y: p.y - 13, width: PILL, height: 26, rx: 13, fill: 'var(--node)', stroke: sel ? 'var(--accent)' : 'var(--line)', 'stroke-width': sel ? 2.5 : 1.5, 'data-move': id, style: 'cursor:pointer' }, g);
      el('text', { x: rx + PILL / 2, y: p.y + 4.5, 'text-anchor': 'middle', fill: 'var(--text)', 'font-size': 12.5, 'font-family': 'Atkinson Hyperlegible, sans-serif', 'pointer-events': 'none' }, g).textContent = p.label;
    }
    if (p.side !== 'out') { // the wiring handle
      const hx = p.side === 'in' ? p.x : p.x + 15;
      el('circle', { cx: hx, cy: p.y, r: 9, fill: 'transparent', style: 'cursor:crosshair', 'data-wire': id }, g);
      el('circle', { cx: hx, cy: p.y, r: 3.5, fill: 'var(--accent)', 'pointer-events': 'none' }, g);
    }
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter') { S.sel = id; render(); } });
  }
  side(); meter();
}

// ---- pointer: move neurons, draw wires ----
const pt = (e) => { const r = svg.getBoundingClientRect(); return { x: (e.clientX - r.left) * box.w / r.width, y: (e.clientY - r.top) * box.h / r.height }; };
svg.addEventListener('pointerdown', (e) => {
  const t = e.target;
  if (t.dataset.wire) { drag = { kind: 'wire', id: t.dataset.wire }; }
  else if (t.dataset.move) { drag = { kind: 'move', id: t.dataset.move, moved: false, start: pt(e) }; }
  else { S.sel = null; render(); return; }
  svg.setPointerCapture(e.pointerId); e.preventDefault();
});
svg.addEventListener('pointermove', (e) => {
  if (!drag) return; const q = pt(e);
  if (drag.kind === 'wire') { const p = P.get(drag.id); const sx = p.side === 'in' ? p.x : p.x + 15; const mx = (sx + q.x) / 2; svg.querySelector('#ghost').setAttribute('d', `M ${sx} ${p.y} C ${mx} ${p.y}, ${mx} ${q.y}, ${q.x} ${q.y}`); }
  else if (drag.kind === 'move') {
    if (Math.hypot(q.x - drag.start.x, q.y - drag.start.y) > 4) drag.moved = true;
    const n = S.neurons.find((m) => m.id === drag.id);
    if (n && drag.moved) { n.x = clamp((q.x - PAD_L) / (box.w - PAD_L - PAD_R), 0, 1); n.y = clamp((q.y - 30) / (box.h - 80), 0, 1); render(); }
  }
});
svg.addEventListener('pointerup', (e) => {
  if (!drag) return; const d = drag; drag = null;
  if (d.kind === 'wire') {
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-id]')?.dataset.id;
    if (target && target !== d.id) { if (canWire(d.id, target)) S.wires.add(d.id + '|' + target); else toast(target.startsWith('i:') ? 'Inputs only send signals.' : 'That would make a loop. Signals only flow forward.'); }
    render();
  } else if (!d.moved) { S.sel = S.sel === d.id ? null : d.id; render(); }
});
svg.addEventListener('dblclick', (e) => { if (e.target !== svg) return; const q = pt(e); addNeuron(clamp((q.x - PAD_L) / (box.w - PAD_L - PAD_R), 0, 1), clamp((q.y - 30) / (box.h - 80), 0, 1)); });
function addNeuron(x = .3 + Math.random() * .4, y = .15 + Math.random() * .7) { const n = { id: 'n' + nid++, x, y, act: 'relu' }; S.neurons.push(n); S.sel = n.id; render(); }

// ---- side panel ----
function side() {
  const box2 = $('sel'); const n = S.neurons.find((m) => m.id === S.sel);
  if (!n) {
    const io = ALL_INPUTS.find((i) => i.id === S.sel) || OUTPUTS.find((o) => o.id === S.sel);
    box2.innerHTML = io ? `<h2>${io.label}</h2><p class="note">${io.id.startsWith('o:') ? 'An output. Whatever arrives here moves the car.' : 'An input. It reads the world and sends a number into the brain.'}</p>`
      : `<h2>Selected</h2><p class="note">Nothing yet. Click a neuron to change how it responds.</p>`;
    return;
  }
  let ins = 0, outs = 0; for (const w of S.wires) { const [a, b] = w.split('|'); if (b === n.id) ins++; if (a === n.id) outs++; }
  box2.innerHTML = `<h2>Neuron</h2>
    <div class="fx" role="group" aria-label="Transfer function">${Object.keys(FX).map((k) => `<button type="button" id="fx-${k}" data-fx="${k}" aria-pressed="${n.act === k}"><svg viewBox="-10 -7 20 14"><path d="${FX[k].g}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>${FX[k].n}<small>${UP[k]}</small></button>`).join('')}</div>
    <p class="note" style="margin-top:8px">${FX[n.act].d}</p>
    <dl class="kv" style="margin-top:8px"><dt>Wires in</dt><dd>${ins}</dd><dt>Wires out</dt><dd>${outs}</dd></dl>
    <button class="link" id="rm" type="button" style="margin-top:8px">Delete neuron</button>`;
  box2.querySelectorAll('[data-fx]').forEach((b) => b.addEventListener('click', () => { n.act = b.dataset.fx; render(); }));
  $('rm').onclick = () => { S.neurons = S.neurons.filter((m) => m !== n); S.sel = null; render(); };
}
function inputsList() {
  $('inputs').innerHTML = ALL_INPUTS.map((i) => `<button type="button" class="row" id="in-${i.id.slice(2)}" data-in="${i.id}" aria-pressed="${S.on.has(i.id)}">${i.label}<small>${COST[i.k] ? COST[i.k] : 'free'}</small></button>`).join('');
  $('inputs').querySelectorAll('[data-in]').forEach((b) => b.addEventListener('click', () => { const id = b.dataset.in; S.on.has(id) ? S.on.delete(id) : S.on.add(id); inputsList(); render(); }));
}
function meter() {
  const e = energy(); const over = e.total > BUDGET;
  const f = $('eFill'); f.style.width = `${clamp(e.total / BUDGET, 0, 1) * 100}%`; f.classList.toggle('over', over);
  $('eVal').textContent = over ? `${e.total.toFixed(1)} / ${BUDGET} per tick · ${Math.round(e.noise * 100)}% noise` : `${e.total.toFixed(1)} / ${BUDGET} per tick`;
  $('eVal').classList.toggle('over', over);
  $('ledger').innerHTML = `<dt>Inputs</dt><dd>${e.sens.toFixed(2)}</dd><dt>Neurons</dt><dd>${e.up.toFixed(2)}</dd><dt>Wires (est.)</dt><dd>${e.fire.toFixed(2)}</dd><dt>Total</dt><dd>${e.total.toFixed(2)}</dd>`;
}

// ---- tools ----
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2000); }
$('addN').onclick = () => addNeuron();
$('clear').onclick = () => { S.wires.clear(); render(); };
$('tidy').onclick = () => { // arrange into columns by depth
  const depth = new Map(); const get = (id) => { if (id.startsWith('i:')) return 0; if (depth.has(id)) return depth.get(id); depth.set(id, 1); let d = 1; for (const w of S.wires) { const [a, b] = w.split('|'); if (b === id) d = Math.max(d, get(a) + 1); } depth.set(id, d); return d; };
  S.neurons.forEach((n) => get(n.id)); const maxD = Math.max(1, ...S.neurons.map((n) => depth.get(n.id)));
  const cols = new Map(); S.neurons.forEach((n) => { const d = depth.get(n.id); if (!cols.has(d)) cols.set(d, []); cols.get(d).push(n); });
  for (const [d, list] of cols) list.forEach((n, k) => { n.x = maxD === 1 ? .5 : (d - 1) / (maxD - 1) * .7 + .15; n.y = list.length === 1 ? .5 : k / (list.length - 1); });
  render();
};
$('name').onclick = () => { const b = $('name'); b.textContent = b.textContent === 'Untitled brain' ? 'Gerald' : 'Untitled brain'; };
$('train').onclick = () => toast('Training opens the arena. Not part of this mock-up.');
addEventListener('resize', render);
addEventListener('keydown', (e) => { if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel?.startsWith('n')) { S.neurons = S.neurons.filter((m) => m.id !== S.sel); S.sel = null; render(); } });

starter(); S.sel = S.neurons[1].id; inputsList(); render();
</script>
