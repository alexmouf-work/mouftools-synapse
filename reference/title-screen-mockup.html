<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synapse title screen</title>
<style>
:root { --bg: #eef1f6; --panel: #ffffff; --line: #d9dee8; --text: #1d2330; --muted: #6a7385; --accent: #2f6fde; --accent-soft: #e3ecfc;
  --spike: #ffc21a; --node: #ffffff; --wire: #b8c0cf; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15181e; --panel: #20252e; --line: #2f3541; --text: #e6e9ef; --muted: #98a1b2; --accent: #6b9cff; --accent-soft: #24304a; --node: #232933; --wire: #3a4252; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #15181e; --panel: #20252e; --line: #2f3541; --text: #e6e9ef; --muted: #98a1b2; --accent: #6b9cff; --accent-soft: #24304a; --node: #232933; --wire: #3a4252; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
#net { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line);
  padding: 22px 22px 20px; text-align: center; }
h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -.01em; }
.tag { margin: 6px 0 18px; color: var(--muted); font-size: 14px; }
.btn { display: block; width: 100%; height: 46px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 0; font: inherit; font-size: 16px; cursor: pointer; }
.btn + .btn { margin-top: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.join { display: flex; gap: 8px; margin-top: 8px; }
.join input { flex: 1; min-width: 0; height: 46px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 0; font: inherit; font-size: 18px; letter-spacing: .3em; text-align: center; text-transform: uppercase; }
.join .btn { width: 96px; margin: 0; }
.or { margin: 12px 0 4px; color: var(--muted); font-size: 12px; }
.note { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
.back { margin-top: 12px; background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 6px; }
[hidden] { display: none !important; }
</style></head><body>
<canvas id="net" aria-hidden="true"></canvas>
<main class="card">
  <h1>Synapse</h1>
  <p class="tag">Build a brain. Train it. Race it.</p>
  <section id="home">
    <button class="btn primary" type="button">Sandbox</button>
    <button class="btn" type="button" id="toMatch">Match</button>
  </section>
  <section id="match" hidden>
    <button class="btn primary" type="button">Create a room</button>
    <p class="or">or join one</p>
    <form class="join" onsubmit="return false"><input id="code" maxlength="4" placeholder="CODE" aria-label="Room code" autocomplete="off"><button class="btn" type="submit">Join</button></form>
    <p class="note">Up to 100 players</p>
    <button class="back" type="button" id="back">Back</button>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id), css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
$('toMatch').onclick = () => { $('home').hidden = true; $('match').hidden = false; $('code').focus(); };
$('back').onclick = () => { $('match').hidden = true; $('home').hidden = false; };
// a quiet brain behind the card: columns of cells, fully wired, firing at their own rates
const c = $('net'), g = c.getContext('2d'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, cells = [], wires = [], seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function build() {
  const dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  seed = 7; cells = []; wires = [];
  const cols = W < 700 ? [3, 4, 4, 2] : [4, 6, 6, 5, 2], gap = W / (cols.length + 1);
  cols.forEach((n, ci) => { for (let k = 0; k < n; k++) cells.push({ ci, x: gap * (ci + 1), y: H / 2 + (k - (n - 1) / 2) * Math.min(90, H / (n + 1)), hz: 0.2 + rnd() * 1.6, ph: rnd(), fl: 0 }); });
  for (const a of cells) for (const b of cells) if (b.ci === a.ci + 1) wires.push([a, b, rnd() * 2 - 1]);
}
function draw(dt) {
  g.clearRect(0, 0, W, H);
  g.lineWidth = 1;
  for (const [a, b] of wires) { g.strokeStyle = css('--wire'); g.globalAlpha = 0.35 + 0.5 * a.fl; const dx = b.x - a.x; g.beginPath(); g.moveTo(a.x, a.y); g.bezierCurveTo(a.x + dx * .45, a.y, b.x - dx * .45, b.y, b.x, b.y); g.stroke(); }
  g.globalAlpha = 1;
  for (const p of cells) {
    if (!reduce) { p.ph += p.hz * dt; if (p.ph >= 1) { p.ph -= 1; p.fl = 1; } p.fl = Math.max(0, p.fl - dt * 4); }
    g.fillStyle = css('--node'); g.strokeStyle = css('--wire'); g.lineWidth = 1.5; g.beginPath(); g.arc(p.x, p.y, 11, 0, 7); g.fill(); g.stroke();
    if (p.fl > 0) { g.globalAlpha = p.fl; g.fillStyle = css('--spike'); g.beginPath(); g.arc(p.x, p.y, 9, 0, 7); g.fill(); g.globalAlpha = 1; }
  }
}
addEventListener('resize', build); build();
let last = performance.now();
(function frame(now) { const dt = Math.min(0.05, Math.max(0, now - last) / 1000); last = now; draw(dt); requestAnimationFrame(frame); })(last);
</script>
</body></html>
