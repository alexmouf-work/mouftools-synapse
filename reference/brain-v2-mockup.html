<title>Synapse Brain Designer</title>
<style>
/* Layout: a nervous system read left to right, built by touch. A tray of senses (tap to add a cell) | the field:
   input cells as symbol circles, lines of neurons (one function per line), the car whose wheels are motor neurons |
   a narrow panel for whatever you tapped. Top bar: the energy split, brain power against speed. Plain workbench look. */
:root {
  --bg: #eef0f3; --canvas: #f7f8fa; --dot: #d3d8e0; --panel: #ffffff; --line: #dde1e8;
  --text: #1d2330; --muted: #6a7385; --accent: #2f6fde; --accent-soft: #e3ecfc;
  --band: rgba(47,111,222,.045); --spike: #ffc21a; --speed: #3fb3a3; --node: #ffffff; --car: #5b6b88; --minus: #d9465b;
  --shadow: 0 1px 2px rgba(20,30,50,.08), 0 2px 8px rgba(20,30,50,.06);
  --sans: Arial, Helvetica, sans-serif;
  --mono: Arial, Helvetica, sans-serif; /* one font across the site (principal 2026-11-04) */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181e; --canvas: #1a1e25; --dot: #2c323d; --panel: #20252e; --line: #2f3541; --text: #e6e9ef; --muted: #98a1b2;
  --accent: #6b9cff; --accent-soft: #24304a; --band: rgba(107,156,255,.06); --node: #232933; --car: #9fb0d0; --minus: #ff7085;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15181e; --canvas: #1a1e25; --dot: #2c323d; --panel: #20252e; --line: #2f3541; --text: #e6e9ef; --muted: #98a1b2;
  --accent: #6b9cff; --accent-soft: #24304a; --band: rgba(107,156,255,.06); --node: #232933; --car: #9fb0d0; --minus: #ff7085;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-variant-numeric: tabular-nums; font-size: 14px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* One layout, phone-landscape sized (860 × 400), scaled whole to fit any screen: a laptop is the phone app, larger. */
html, body { overflow: hidden; }
.app { position: fixed; left: 0; top: 0; width: 860px; height: 400px; transform-origin: 0 0; display: grid;
  grid-template-rows: 36px 30px 1fr; gap: 6px; padding: 6px 10px; font-size: 12px; }
.top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.word { font-weight: 700; font-size: 15px; }
.alloc { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 11.5px; min-width: 0; }
.alloc b { font-family: var(--mono); font-weight: 400; font-variant-numeric: tabular-nums; }
.split { position: relative; width: 140px; height: 10px; border-radius: 0; background: var(--speed); overflow: hidden; flex: none; }
.split i { position: absolute; inset: 0 auto 0 0; background: var(--spike); transition: width .12s linear; }
.split s { position: absolute; inset: 0 auto 0 0; background: var(--spike); opacity: .35; }
.split em { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .55; }
.btn { min-height: 30px; border: 1px solid var(--line); background: var(--panel); padding: 0 12px; border-radius: 0; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap; font-size: 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.rulebar { display: flex; align-items: center; justify-content: center; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 0; }
.tr { display: flex; gap: 2px; flex: none; }
.tr button { height: 22px; border: 1px solid transparent; background: transparent; border-radius: 0; cursor: pointer; font-size: 11px; padding: 0 7px; }
.tr button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.eq { font-size: 12.5px; white-space: nowrap; color: var(--text); }
.eq span { font-family: var(--mono); }
.nums { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-variant-numeric: tabular-nums; }
.nums b { color: var(--text); font-weight: 400; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 6px; min-height: 0; }
.board { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 0; overflow: hidden;
  background: radial-gradient(var(--dot) 1px, transparent 1.1px) 0 0 / 16px 16px, var(--canvas); }
.tray { position: absolute; left: 0; top: 0; bottom: 0; width: 54px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 6px; z-index: 1; background: var(--panel); border-right: 1px solid var(--line); }
.tray .sense { height: 40px; flex: none; }
.sense { position: relative; border: 1px solid var(--line); border-radius: 0; background: transparent; cursor: pointer; padding: 0; }
.sense:active { transform: scale(.96); }
.sense.full { cursor: default; opacity: .55; }
.sense.full:active { transform: none; }
.sense .nm { display: none; }
.sense .plus { position: absolute; right: 2px; top: 0; color: var(--accent); font-weight: 700; font-size: 10px; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
#net { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
#net .hit { pointer-events: auto; cursor: pointer; }
.tools { position: absolute; right: 6px; bottom: 6px; z-index: 4; display: flex; gap: 6px; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow: auto; min-height: 0; }
.side h2 { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; margin: 0; font-size: 11.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 11px; text-align: right; }
.fx { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.fx button { min-height: 40px; min-width: 0; border: 1px solid var(--line); background: transparent; border-radius: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 2px; font-size: 11px; }
.fx button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.use { margin: 0; font-size: 11px; line-height: 1.35; color: var(--muted); }
.use b { color: var(--text); font-variant-numeric: tabular-nums; }
.count { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin-top: 12px; font-size: 11.5px; color: var(--muted); }
.count b { color: var(--text); font-variant-numeric: tabular-nums; font-size: 13px; }
.count input { grid-column: 1 / -1; width: 100%; height: 28px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
.count input::-webkit-slider-runnable-track { height: 4px; background: var(--line); }
.count input::-moz-range-track { height: 4px; background: var(--line); }
.count input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; background: var(--accent); border: 0; border-radius: 0; }
.count input::-moz-range-thumb { width: 18px; height: 18px; background: var(--accent); border: 0; border-radius: 0; }
.count input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fx svg { width: 20px; height: 13px; flex: none; }
.acts { display: grid; gap: 4px; }
.acts .btn { box-shadow: none; text-align: left; white-space: normal; padding: 5px 9px; line-height: 1.25; font-size: 11.5px; }
.acts .danger { color: var(--minus); }
.desc { margin: 0 0 4px; font-size: 10.5px; line-height: 1.3; color: var(--muted); }
.bin { margin-top: auto; align-self: flex-end; height: 36px; width: 36px; border: 0; border-radius: 50%; background: #d9465b; color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
.bin:active { transform: scale(.97); }
#graph { display: block; width: 100%; aspect-ratio: 1; margin: 2px 0 6px; }
#insp { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.empty { margin: auto; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.4; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 0; z-index: 9; max-width: calc(100% - 32px); }
#rotate { display: none; }

dialog#trainDlg::backdrop { background: rgba(10, 14, 22, .45); }
dialog#trainDlg p { margin: 0 0 10px; }
.gens { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px; }
.gens button { min-height: 34px; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 0; font: inherit; font-size: 12.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
.gens button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
dialog#confirm { border: 1px solid var(--line); border-radius: 0; background: var(--panel); color: var(--text); padding: 14px; width: 260px; box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.4; }
dialog#confirm::backdrop { background: rgba(10, 14, 22, .45); }
dialog#confirm p { margin: 0 0 12px; }
.cf { display: flex; justify-content: flex-end; gap: 6px; }
.btn.red { background: #d9465b; border-color: #d9465b; color: #fff; font-weight: 700; }
@media (orientation: portrait) and (max-width: 700px) {
  body:not(.portrait-ok) #rotate { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); padding: 24px; text-align: center; }
}
@media (prefers-reduced-motion: reduce) { .split i { transition: none; } }

<div class="app">
  <header class="top">
    <span class="word">Synapse</span>
    
    <div class="tr" id="trainers" role="group" aria-label="Trainer"></div>

      <span>Speed <b id="aSpeed"></b></span>
    </div>
    <button class="btn" type="button" id="reset">Reset</button>
    <button class="btn primary" type="button" id="train">Train</button>
  </header>
  <div class="rulebar" aria-label="Learning rule"><div class="eq" id="eq"></div></div>
  <main class="work">
    <div class="board" id="board">
      <div class="tray" id="tray"></div>
      <canvas id="gl"></canvas>
      <svg id="net" aria-label="The brain"></svg>

    </aside>

</div>
<div id="rotate"><div><h1 style="margin:0 0 8px;font-size:20px">Turn your phone sideways</h1><p class="note">Senses on the left, the car on the right.</p><button class="btn" id="stay" type="button" style="margin-top:12px">Continue in portrait</button></div></div>
<div id="toast" hidden></div>
<dialog id="trainDlg" aria-labelledby="tdT"><p id="tdT"><b>Train for how many generations?</b></p><div class="gens" id="gens" role="group" aria-label="Generations"></div><div class="cf"><button class="btn" type="button" id="tdNo">Cancel</button><button class="btn primary" type="button" id="tdGo">Train</button></div></dialog>
<dialog id="confirm" aria-labelledby="cfT"><p id="cfT"><b>Reset the brain?</b><br>This goes back to the starting brain and clears its training.</p><div class="cf"><button class="btn" type="button" id="cfNo">Cancel</button><button class="btn red" type="button" id="cfYes">Reset</button></div></dialog>

<script type="module">

const $ = (id) => document.getElementById(id);

const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX_HZ = 14;

// one function per hidden layer; wheels fixed to tanh
const FX = {
  linear: { n: 'Linear', g: 'M-8 6 L8 -6', f: (z) => z, rate: (y) => clamp((y + 1) / 2, 0, 1), cost: 0.75, d: 'Passes its input straight through.' },
  relu: { n: 'ReLU', g: 'M-8 3 H0 L8 -5', f: (z) => clamp(z, 0, 4), rate: (y) => clamp(y, 0, 1), cost: 1, d: 'Silent below zero, firing faster as input grows.' },
  sigmoid: { n: 'Sigmoid', g: 'M-8 4 C-2 4 2 -4 8 -4', f: (z) => 1 / (1 + Math.exp(-z)), rate: (y) => y, cost: 1.5, d: 'Smooth from silent to flat out; idles at half rate.' },
  tanh: { n: 'Tanh', g: 'M-8 5 C-2 5 2 -5 8 -5', f: (z) => Math.tanh(z), rate: (y) => (y + 1) / 2, cost: 1.5, d: 'Idles at half rate; excitation speeds it up, inhibition slows it down.' },
};
const spread = (k, n) => (n === 1 ? 0 : -90 + 180 * k / (n - 1));
const dirTag = (d) => (Math.abs(d) < 1 ? 'ahead' : `${d < 0 ? 'left' : 'right'} ${Math.abs(Math.round(d))}°`);
const SENSES = [
  { id: 'boundary', name: 'Boundary vector cells', sym: 'wall', cost: 1.5, max: 7, about: 'Fire the nearer a wall is inside their field, which faces one way from the car. Like the border and boundary-vector cells of a rat. More cells spread their fields across the front.', tag: (k, n) => dirTag(spread(k, n)) },
  { id: 'object', name: 'Landmark cells', sym: 'flag', cost: 1.5, max: 5, about: 'Fire the nearer the finish line is inside their field, like the object-vector cells of the entorhinal cortex.', tag: (k, n) => dirTag(spread(k, n)) },
  { id: 'hd', name: 'Head direction cells', sym: 'arrow', cost: 1, max: 8, about: 'Fires as a cosine of the car’s compass heading. One cell can’t tell left from right; two (cosine and sine) pin the heading down.', tag: (k, n) => `prefers ${Math.round(360 * k / n * (n === 2 ? 0.5 : 1))}°` },
  { id: 'grid', name: 'Grid cells', sym: 'hex', cost: 1, max: 6, about: 'Fire at the corners of a hexagonal grid laid over the ground. The first two take two scales; more take spread phases.', tag: (k) => `${k % 2 ? 'large' : 'small'} scale, phase ${Math.floor(k / 2) + 1}` },
  { id: 'speed', name: 'Speed cells', sym: 'gauge', cost: 1, max: 1, about: 'Fire faster the faster the car goes.', tag: () => '' },
];
const WHEELS = [['fl', 'Front-left'], ['fr', 'Front-right'], ['rl', 'Rear-left'], ['rr', 'Rear-right']].map(([id, label]) => ({ id: 'o:' + id, label }));
const S = { count: { boundary: 1, object: 0, hd: 1, grid: 0, speed: 0 }, trainer: 'backprop', trainedAs: null, layers: [{ n: 3, fn: 'tanh' }], off: new Set(), sel: null };
const WIRE_COST = 0.075, WHEEL_COST = 0.75; // all costs halved 2026-11-04: twice the energy allowed
// Sandbox has no energy limit: any brain is allowed, and a brain that fires hard just leaves less for speed (never
// below SPEED_FLOOR, so every car can still move). vs CPU and Multiplayer keep the 100% limit.
const MODE = 'sandbox', SPEED_FLOOR = 10;

// ---- ids, wires (default: every layer fully connected to the previous) ----
const inputIds = () => SENSES.flatMap((s) => Array.from({ length: S.count[s.id] }, (_, k) => `i:${s.id}:${k}`));

// ---- energy: a fixed split, brain power against speed ----
function brainShare() {
  let sens = 0; for (const s of SENSES) sens += S.count[s.id] * s.cost;
  const neur = S.layers.reduce((a, l) => a + l.n * FX[l.fn].cost, 0) + 4 * WHEEL_COST;
  return sens + neur + wires().length * WIRE_COST;

function tryChange(apply, undo, what) { apply(); const b = brainShare(); if (MODE !== 'sandbox' && b > 100) { undo(); toast('Over 100%.'); return false; } return true; }
// Each tick, every cell spends its cost × its firing rate (and each wire its cost × its source's rate); what is left
// of the supply goes to speed. brainShare() is the flat-out case: a design may not pass 100% even then.
function loadOf(rate) {

  for (const ids of allLayers()) for (const id of ids) e += cost(id) * rate(id);
  for (const [a] of wires()) e += WIRE_COST * rate(a);
  return e;
}
const restRate = (id) => id.startsWith('i:') ? 0 : id.startsWith('o:') ? 0.5 : FX[S.layers[depth(id) - 1].fn].rate(FX[S.layers[depth(id) - 1].fn].f(0));
function showAlloc(live) {
  const top = brainShare(), lo = live ?? loadOf(restRate), f = (v) => Math.round(Math.max(0, v)), bar = (v) => clamp(v, 0, 100);
  const sp = (load) => Math.round(Math.max(SPEED_FLOOR, 100 - load));
  $('aFill').style.width = `${bar(lo)}%`; $('aRange').style.width = live == null ? `${bar(top)}%` : '0%';
  $('aBrain').textContent = live == null ? (f(lo) === f(top) ? `${f(lo)}%` : `${f(lo)}–${f(top)}%`) : `${f(lo)}%`;
  $('aSpeed').textContent = live == null ? (sp(top) === sp(lo) ? `${sp(lo)}%` : `${sp(top)}–${sp(lo)}%`) : `${sp(lo)}%`;
}

// ---- the replay the brain runs on ----
function world(t) {
  const T = t % 60, c = Math.sin(T * 0.55) * 0.9, front = clamp(0.15 + 0.85 * Math.max(0, Math.sin(T * 0.7 - 1)) ** 2, 0, 1);
  return { T, c, front, heading: (T * 22) % 360, x: 40 * Math.cos(T * 0.25), y: 30 * Math.sin(T * 0.3), lap: (T % 20) / 20, fin: Math.max(0, 1 - Math.abs((T % 20) - 17) / 3), speed: clamp(0.55 + 0.35 * Math.sin(T * 0.5 + 1), 0, 1) };
}
function senseValue(sid, k, n, w) {
  const d = spread(k, n) * Math.PI / 180;
  if (sid === 'boundary') return clamp(0.2 + 0.55 * w.c * Math.sin(d) + w.front * Math.cos(d) ** 4 * 0.8, 0, 1);
  if (sid === 'whisker') return clamp((0.2 + 0.55 * w.c * Math.sin(d) + w.front * Math.cos(d) ** 4 * 0.8 - 0.62) / 0.38, 0, 1);
  if (sid === 'object') return clamp(w.fin * (0.5 + 0.5 * Math.cos(d - 0.3)), 0, 1);

  if (sid === 'hd') return Math.cos((w.heading - 360 * k / n * (n === 2 ? 0.5 : 1)) * Math.PI / 180);
  if (sid === 'grid') { const sc = k % 2 ? 26 : 11, ph = Math.floor(k / 2) * 2.1; let g = 0; for (let a = 0; a < 3; a++) { const th = a * Math.PI / 3; g += Math.cos((w.x * Math.cos(th) + w.y * Math.sin(th)) / sc * 2 * Math.PI + ph); } return clamp((g + 1.5) / 4.5, 0, 1); }

function forward(w) {

  return act;
}
const rateOf = (id, v) => id.startsWith('i:hd') ? (v + 1) / 2 : id.startsWith('i:') ? clamp(v, 0, 1) : id.startsWith('o:') ? FX.tanh.rate(v) : FX[S.layers[depth(id) - 1].fn].rate(v);

// ---- layout ----
const svg = $('net'), board = $('board');
let P = new Map(), box = { w: 1000, h: 600 }, car = null, trayW = 140, R = 24;
// The board splits into equal regions, one per column: inputs, each hidden layer, the car. Everything sits at its
// region's centre, and the alternating bands are exactly these regions.
let regions = [];
function layout() {
  box = { w: board.clientWidth, h: board.clientHeight }; svg.setAttribute('viewBox', `0 0 ${box.w} ${box.h}`);
  trayW = $('tray').offsetLeft + $('tray').offsetWidth;
  P = new Map();
  const C = S.layers.length + 2, Wb = box.w - trayW;
  R = 10.5;
  const insN = inputIds().length, perCol0 = Math.max(1, Math.floor((box.h - 34 - 40) / (2 * R + 9))), inCols = Math.max(1, Math.ceil(insN / perCol0));

// x/y curve: transfer functions and speed
function graphCurve(fn, xl, yl = 'output') {

}
function speedLine() {

function graphSense(sid, k, n) {

const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0.2, 5.6); cam.lookAt(0, 0, 0);

  const draw = (sym, cx, cy, size) => { if (size < 8) return; const x = cx - size / 2, y = r.height - cy - size / 2; renderer.setViewport(x, y, size, size); renderer.setScissor(x, y, size, size); cam.aspect = 1; cam.updateProjectionMatrix(); SYM[sym].upd(t, w); renderer.render(SYM[sym].s, cam); };

// ---- the learning rule, always on screen (mock-up numbers from the replay) ----
const TRAINERS = {
  evolution: { n: 'Evolution', eq: 'w′ = w + σ·ε' },
  backprop: { n: 'Backprop', eq: 'Δw = η·δ·x' },
  ac: { n: 'Actor-critic', eq: 'Δw = α·δ·∂log π/∂w' },
  arp: { n: 'A<sub>RP</sub>', eq: 'Δw = ρ·(±y − p)·x' },
};

function buildTrainers() { $('trainers').innerHTML = Object.entries(TRAINERS).map(([k, v]) => `<button type="button" data-tr="${k}" aria-pressed="${S.trainer === k}">${v.n}</button>`).join(''); $('trainers').querySelectorAll('[data-tr]').forEach((b) => b.onclick = () => { S.trainer = b.dataset.tr; buildTrainers(); }); $('eq').innerHTML = `Learning Rule : <span>${TRAINERS[S.trainer].eq}</span>`; }
let ruleT = 0;
function showRule(act, t) {
  ruleT += 1; if (ruleT % 12) return;
  const W = wires(), L = allLayers(), delta = new Map(), tr = S.trainer;
  // outputs: backprop copies a teacher; the RL rules get a reward signal
  const fr = Math.max(0, Math.sin(t * 0.7 - 1)) ** 2, wall = fr > 0.7, r = wall ? 0 : 1;
  L[L.length - 1].forEach((id, j) => { const y = act.get(id) ?? 0, target = Math.tanh(Math.sin(t * 0.8 + j)); delta.set(id, (target - y) * (1 - y * y)); });
  for (let i = L.length - 2; i >= 1; i--) for (const a of L[i]) { let s = 0; for (const [x, b, w] of W) if (x === a) s += w * (delta.get(b) ?? 0); delta.set(a, dF(S.layers[i - 1].fn, act.get(a) ?? 0) * s); }

    const x = act.get(a) ?? 0, d = delta.get(b) ?? 0;

    if (!best || Math.abs(dw) > Math.abs(best.dw)) best = { a, b, w, x, d, dw };
  }
  if (!best) return;
  const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(3);
  const line = tr === 'backprop' ? `0.05 × ${f(best.d)} × ${f(best.x)} = <b>${f(best.dw)}</b>`
    : tr === 'ac' ? `δ = ${f(0.1 + 0.4 * Math.sin(t * 0.9))} (${r ? 'progress' : 'wall'}) · Δw = <b>${f(best.dw)}</b>`
    : tr === 'arp' ? `${r ? 'reward' : 'penalty'} · Δw = <b>${f(best.dw)}</b>` : `σ = 0.21 · this wire: <b>${f(best.dw)}</b>`;
  $('nums').innerHTML = `${label(best.a)} → ${label(best.b)} · ${line}`;
  const p = P.get(best.a), q = P.get(best.b), hl = svg.querySelector('#ruleWire');
  if (p && q && hl) { const x1 = p.x + (p.kind === 'in' ? R : 11), x2 = q.x - (q.kind === 'out' ? 9 : 11), dx = x2 - x1; hl.setAttribute('d', `M ${x1} ${p.y} C ${x1 + dx * .45} ${p.y}, ${x2 - dx * .45} ${q.y}, ${x2} ${q.y}`); }

// ---- build mode: nothing fires; an active brain (driving or training) fires ----
let active = false;
const flash = new Map(), phase = new Map();
let last = performance.now(), simT = 8;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; simT += dt;
  const w = world(active ? simT : 8);
  if (!active) { svg.querySelectorAll('[data-spk]').forEach((n) => n.setAttribute('opacity', 0)); svg.querySelectorAll('[data-arrow]').forEach((n) => n.setAttribute('d', '')); drawSymbols(simT, w); requestAnimationFrame(frame); return; }
  const act = forward(w);
  showAlloc(loadOf((id) => rateOf(id, act.get(id) ?? 0)));
  for (const [id, v] of act) {
    const node = svg.querySelector(`[data-spk="${CSS.escape(id)}"]`); if (!node) continue;
    const rate = rateOf(id, v);
    if (reduce) node.setAttribute('opacity', (rate * 0.85).toFixed(2));
    else { let ph = (phase.get(id) ?? Math.random()) + rate * MAX_HZ * dt, fl = flash.get(id) ?? 0; if (ph >= 1) { ph -= Math.floor(ph); fl = 1; } fl = Math.max(0, fl - dt * 9); phase.set(id, ph); flash.set(id, fl); node.setAttribute('opacity', fl.toFixed(2)); }
    if (id.startsWith('o:')) { const p = P.get(id), a = svg.querySelector(`[data-arrow="${CSS.escape(id)}"]`); if (a && p) { const sp = v, s = Math.sign(sp || 1), x0 = p.x + 11 * s; a.setAttribute('d', Math.abs(sp) < 0.05 ? '' : `M ${x0} ${p.y} h ${14 * sp} l ${-3 * s} -3 m ${3 * s} 3 l ${-3 * s} 3`); } }
  }
  drawSymbols(simT, w);
  requestAnimationFrame(frame);
}
let SCALE = 1;
function fit() { const a = document.querySelector('.app'); SCALE = Math.min(innerWidth / 860, innerHeight / 400); a.style.transform = `translate(${(innerWidth - 860 * SCALE) / 2}px, ${(innerHeight - 400 * SCALE) / 2}px) scale(${SCALE})`; renderer.setPixelRatio(Math.min(devicePixelRatio, 2) * SCALE); }
addEventListener('resize', () => { fit(); render(); }); fit();
