<title>Synapse Brain Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a nervous system read left to right, built by touch. A tray of senses (tap to add a cell) | the field:
   input cells as symbol circles, lines of neurons (one function per line), the car whose wheels are motor neurons |
   a narrow panel for whatever you tapped. Top bar: the energy split, brain power against speed. Plain workbench look. */
:root {
  --bg: #eef0f3; --canvas: #f7f8fa; --dot: #d3d8e0; --panel: #ffffff; --line: #dde1e8;
  --text: #1d2330; --muted: #6a7385; --accent: #2f6fde; --accent-soft: #e3ecfc;
  --band: rgba(47,111,222,.045); --spike: #ffc21a; --speed: #3fb3a3; --node: #ffffff; --car: #5b6b88; --minus: #d9465b;
  --shadow: 0 1px 2px rgba(20,30,50,.08), 0 2px 8px rgba(20,30,50,.06);
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181e; --canvas: #1a1e25; --dot: #2c323d; --panel: #20252e; --line: #2f3541; --text: #e6e9ef; --muted: #98a1b2;
  --accent: #6b9cff; --accent-soft: #24304a; --band: rgba(107,156,255,.06); --node: #232933; --car: #9fb0d0; --minus: #ff7085;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15181e; --canvas: #1a1e25; --dot: #2c323d; --panel: #20252e; --line: #2f3541; --text: #e6e9ef; --muted: #98a1b2;
  --accent: #6b9cff; --accent-soft: #24304a; --band: rgba(107,156,255,.06); --node: #232933; --car: #9fb0d0; --minus: #ff7085;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25); color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 10px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; gap: 12px 16px; min-width: 0; }
.word { font-weight: 700; font-size: 18px; }
.name { color: var(--muted); font-size: 15px; }
.alloc { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 13px; min-width: 0; }
.alloc b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.split { position: relative; width: 220px; height: 14px; border-radius: 7px; background: var(--speed); overflow: hidden; flex: none; }
.split i { position: absolute; inset: 0 auto 0 0; background: var(--spike); transition: width .2s ease; }
.split em { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .55; }
.btn { min-height: 38px; border: 1px solid var(--line); background: var(--panel); padding: 0 16px; border-radius: 12px; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 10px; min-height: 0; }
.board { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  background: radial-gradient(var(--dot) 1.2px, transparent 1.3px) 0 0 / 22px 22px, var(--canvas); }
.tray { position: absolute; left: 10px; top: 10px; bottom: 10px; width: 150px; display: flex; flex-direction: column; gap: 6px; z-index: 1; }
.tray h3 { margin: 2px 4px 2px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sense { flex: 1 1 0; min-height: 36px; max-height: 64px; position: relative; display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px; background: transparent; cursor: pointer; text-align: left; padding: 0 8px 0 4px; }
.sense:active { transform: scale(.98); }
.sense .nm { font-size: 12px; font-weight: 700; line-height: 1.15; }
.sense .ct { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-weight: 400; }
.sense .plus { position: absolute; right: 6px; top: 4px; color: var(--accent); font-weight: 700; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
#net { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
#net .hit { pointer-events: auto; cursor: pointer; }
.tools { position: absolute; right: 12px; bottom: 12px; z-index: 4; display: flex; gap: 8px; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
.side h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; text-align: right; }
.fx { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fx button { min-height: 38px; border: 1px solid var(--line); background: transparent; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.fx button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.fx svg { width: 22px; height: 14px; flex: none; }
.acts { display: grid; gap: 6px; }
.acts .btn { box-shadow: none; text-align: left; white-space: normal; padding: 10px 14px; line-height: 1.3; }
.acts .danger { color: var(--minus); }
.hint { font-size: 12.5px; color: var(--muted); }
.tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
.tr button { min-height: 32px; border: 1px solid var(--line); background: transparent; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.tr button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.eq { font-family: var(--mono); font-size: 14px; padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--text); line-height: 1.5; }
.nums { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.55; font-variant-numeric: tabular-nums; }
.nums b { color: var(--text); font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 9; max-width: calc(100% - 32px); }
#rotate { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  body:not(.portrait-ok) #rotate { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); padding: 24px; text-align: center; }
}
@media (max-height: 560px) and (orientation: landscape) {
  .app { gap: 6px; padding-block: 6px; } .name { display: none; } .split { width: 120px; }
  .work { grid-template-columns: minmax(0, 1fr) 200px; gap: 6px; }
  .tray { width: 104px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(44px, 1fr); }
  .tray h3 { display: none; } .sense { grid-template-columns: 1fr; padding: 0; max-height: none; } .sense .nm { display: none; }
  .side { padding: 10px; gap: 10px; } .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .split i { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <span class="word">Synapse</span>
    
    <div class="alloc" aria-label="Energy split: brain power against speed">
      <span>Brain <b id="aBrain"></b></span>
      <div class="split"><i id="aFill"></i><em title="The mean car: 50/50"></em></div>
      <span>Speed <b id="aSpeed"></b></span>
    </div>
    <button class="btn" type="button">Drive</button>
    <button class="btn primary" type="button">Train</button>
  </header>
  <main class="work">
    <div class="board" id="board">
      <div class="tray" id="tray"></div>
      <canvas id="gl"></canvas>
      <svg id="net" aria-label="The brain"></svg>
      <div class="tools"><button class="btn" id="addLayer" type="button">+ Layer</button></div>
    </div>
    <aside class="side">
      <section id="rule" aria-live="off">
        <h2>Learning rule</h2>
        <div class="tr" id="trainers"></div>
        <div class="eq" id="eq"></div>
        <div class="nums" id="nums"></div>
      </section>
      <section id="insp"></section>
    </aside>
  </main>
</div>
<div id="rotate"><div><h1 style="margin:0 0 8px;font-size:20px">Turn your phone sideways</h1><p class="note">Senses on the left, the car on the right.</p><button class="btn" id="stay" type="button" style="margin-top:12px">Continue in portrait</button></div></div>
<div id="toast" hidden></div>

<script type="module">

  el('path', { d: `M ${cx - w} ${cy - h * .8} Q ${cx - w} ${cy - h} ${cx - w * .86} ${cy - h} L ${cx + w * .55} ${cy - h} L ${cx + w} ${cy - h * .78} Q ${cx + w * 1.08} ${cy} ${cx + w} ${cy + h * .78} L ${cx + w * .55} ${cy + h} L ${cx - w * .86} ${cy + h} Q ${cx - w} ${cy + h} ${cx - w} ${cy + h * .8} Z`, style: 'fill:var(--car);fill-opacity:.1;stroke:var(--car);stroke-opacity:.35', 'stroke-width': 1.5 }, svg);
  el('path', { d: `M ${cx - w * .32} ${cy - h * .6} Q ${cx + w * .46} ${cy - h * .66} ${cx + w * .32} ${cy} Q ${cx + w * .46} ${cy + h * .66} ${cx - w * .32} ${cy + h * .6} Z`, style: 'fill:var(--car);fill-opacity:.12;stroke:var(--car);stroke-opacity:.25' }, svg);
  // wires
  const wg = el('g', {}, svg);
  for (const [a, b, wt] of wires()) {
    const p = P.get(a), q = P.get(b); if (!p || !q) continue;
    const m = Math.min(1, Math.abs(wt)), hot = S.sel && (a === S.sel || b === S.sel);
    const x1 = p.x + (p.kind === 'in' ? R : 16), x2 = q.x - (q.kind === 'out' ? 13 : 16), dx = x2 - x1;
    el('path', { d: `M ${x1} ${p.y} C ${x1 + dx * .45} ${p.y}, ${x2 - dx * .45} ${q.y}, ${x2} ${q.y}`, fill: 'none', style: `stroke:${wireColour(wt)}`, 'stroke-width': 0.6 + Math.abs(wt) * 1.3, opacity: S.sel && !S.sel.startsWith('layer') && !hot ? .1 : 0.25 + m * 0.6, 'stroke-linecap': 'round' }, wg);
  }
  el('path', { id: 'ruleWire', d: '', fill: 'none', style: 'stroke:var(--accent)', 'stroke-width': 5, opacity: .35, 'stroke-linecap': 'round', 'pointer-events': 'none' }, svg);
  // cells (tap to select; tap a second cell to wire/unwire)
  for (const [id, p] of P) {
    const g = el('g', { class: 'hit', 'data-id': id, role: 'button', tabindex: 0 }, svg);
    const sel = S.sel === id;
    if (p.kind === 'in') {
      el('circle', { cx: p.x, cy: p.y, r: R, style: `fill:transparent;stroke:${sel ? 'var(--accent)' : 'var(--line)'}`, 'stroke-width': sel ? 3 : 1.5 }, g);
      el('circle', { cx: p.x, cy: p.y, r: R + 2, 'data-spk': id, style: 'fill:none;stroke:var(--spike)', 'stroke-width': 5, opacity: 0 }, g);
    } else if (p.kind === 'mid') {
      el('circle', { cx: p.x, cy: p.y, r: 16, style: `fill:${sel ? 'var(--accent-soft)' : 'var(--node)'};stroke:${sel ? 'var(--accent)' : 'var(--muted)'}`, 'stroke-width': sel ? 3 : 1.5 }, g);
      el('circle', { cx: p.x, cy: p.y, r: 13.5, 'data-spk': id, style: 'fill:var(--spike)', opacity: 0 }, g);
      el('path', { d: FX[S.layers[p.L].fn].g, transform: `translate(${p.x} ${p.y}) scale(.8)`, fill: 'none', style: 'stroke:var(--text)', 'stroke-width': 1.8, 'stroke-linecap': 'round', 'pointer-events': 'none' }, g);
    } else {
      el('rect', { x: p.x - 13, y: p.y - 9, width: 26, height: 18, rx: 5, style: `fill:var(--node);stroke:${sel ? 'var(--accent)' : 'var(--car)'}`, 'stroke-width': sel ? 3 : 1.5 }, g);
      el('rect', { x: p.x - 10.5, y: p.y - 6.5, width: 21, height: 13, rx: 3, 'data-spk': id, style: 'fill:var(--spike)', opacity: 0 }, g);
      el('path', { 'data-arrow': id, d: '', style: 'stroke:var(--accent);fill:none', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, g);

  });

}
function tap(id) {

    render(); return;
  }
  if (S.sel && S.sel !== id && !S.sel.startsWith('layer') && Math.abs(depth(S.sel) - depth(id)) > 1) toast('Wires join neighbouring layers.');

}

// ---- side panel ----
function inspect() {
  const box2 = $('insp'), id = S.sel;

    const L = +id.slice(6), l = S.layers[L];
    box2.innerHTML = `<h2>Layer ${L + 1}</h2><div class="fx">${Object.entries(FX).map(([k, v]) => `<button type="button" data-fx="${k}" aria-pressed="${l.fn === k}"><svg viewBox="-10 -7 20 14"><path d="${v.g}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>${v.n}</button>`).join('')}</div><dl class="kv" style="margin-top:8px"><dt>Energy per neuron</dt><dd>${FX[l.fn].cost}%</dd></dl><div class="acts" style="margin-top:8px">${S.layers.length > 1 ? '<button class="btn danger" id="rmL" type="button">Remove layer</button>' : ''}</div>`;
    box2.querySelectorAll('[data-fx]').forEach((b) => b.addEventListener('click', () => { const old = l.fn; tryChange(() => (l.fn = b.dataset.fx), () => (l.fn = old), 'That function'); render(); }));
    if ($('rmL')) $('rmL').onclick = () => { S.layers.splice(L, 1); S.sel = null; render(); };

    const [, sid, ks] = id.split(':'), s = SENSES.find((q) => q.id === sid), k = +ks, n = S.count[sid];
    box2.innerHTML = `<h2>${s.name}</h2><dl class="kv">${s.tag(k, n) ? `<dt>Tuning</dt><dd>${s.tag(k, n)}</dd>` : ''}<dt>Energy</dt><dd>${s.cost}%</dd></dl><div class="acts" style="margin-top:8px"><button class="btn danger" id="rm" type="button">Remove</button></div>`;
    $('rm').onclick = () => { S.count[sid]--; S.sel = null; render(); };

    $('wireAll').onclick = () => { const keys = prev.map((a) => a + '|' + id).filter((k) => S.off.has(k)); tryChange(() => keys.forEach((k) => S.off.delete(k)), () => keys.forEach((k) => S.off.add(k)), 'Those wires'); render(); };
    $('unwireAll').onclick = () => { prev.forEach((a) => S.off.add(a + '|' + id)); render(); };
    if ($('rmN')) $('rmN').onclick = () => { S.layers[L].n--; S.sel = null; render(); };

  }
  box2.innerHTML = `<h2>${WHEELS.find((q) => q.id === id).label} wheel</h2><dl class="kv"><dt>Function</dt><dd>tanh (fixed)</dd></dl>`;
}

// ---- tray ----
function buildTray() {
  const tr = $('tray'); tr.querySelectorAll('.sense').forEach((n) => n.remove());
  for (const s of SENSES) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sense'; b.dataset.s = s.id;
    b.setAttribute('aria-label', `Add a ${s.name.replace(/s$/, '')} cell`);
    b.innerHTML = `<span class="ic"></span><span class="nm">${s.name.replace(/ cells$/, '')}<span class="ct">${s.cost}%</span></span><span class="plus" aria-hidden="true">+</span>`;
    b.addEventListener('click', () => {
      if (S.count[s.id] >= s.max) return toast(`${s.name}: ${s.max} is the most${s.max === 1 ? ' (one is enough)' : ''}.`);
      if (tryChange(() => S.count[s.id]++, () => S.count[s.id]--, `A ${s.name.toLowerCase().replace(/s$/, '')}`)) { S.sel = `i:${s.id}:${S.count[s.id] - 1}`;  }

}
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2000); }
$('addLayer').onclick = () => { if (S.layers.length >= 3) return toast('Three hidden layers is the limit here.'); tryChange(() => S.layers.push({ n: 3, fn: 'tanh' }), () => S.layers.pop(), 'A new layer'); render(); };

  wall: scene((g) => { const m1 = mat(0xd98a6c), m2 = mat(0xc5755a); for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { const b = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.3, 0.4), (r + c) % 2 ? m1 : m2); b.position.set((c - 1.5) * 0.66 + (r % 2) * 0.33 - 0.16, r * 0.33 - 0.5, 0); g.add(b); } return (t) => { g.rotation.set(0.25, Math.sin(t * 0.6) * 0.5, 0); }; }),
  whisker: scene((g) => { const snout = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.1, 7), mat(0xc9b8b0)); snout.rotation.z = -Math.PI / 2; g.add(snout); const nose = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 4), mat(0xe58a9a)); nose.position.x = 0.58; g.add(nose); const ws = []; for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.3, 4), mat(0x50555f)); wh.geometry.translate(0, 0.65, 0); wh.position.set(0.35, 0, s * 0.1); wh.userData = { s, k }; g.add(wh); ws.push(wh); } return (t) => { for (const wh of ws) wh.rotation.z = wh.userData.s * (0.9 + wh.userData.k * 0.35) + Math.sin(t * 9 + wh.userData.k) * 0.12 * wh.userData.s - Math.PI / 2 * (wh.userData.s > 0 ? 0 : 0); g.rotation.set(0.5, -0.4, 0); }; }),
  flag: scene((g) => { const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 6), mat(0x8a8f99)); pole.position.x = -0.9; g.add(pole); const geo = new THREE.PlaneGeometry(1.6, 1, 8, 5), cols = [], pos = geo.attributes.position; for (let i = 0; i < pos.count; i++) { const c = (Math.floor((pos.getX(i) + 0.8) * 4) + Math.floor((pos.getY(i) + 0.5) * 4)) % 2 ? 0.95 : 0.12; cols.push(c, c, c); } geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); const flag = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true, side: THREE.DoubleSide })); flag.position.set(-0.1, 0.55, 0); g.add(flag); const base = pos.array.slice(); return (t) => { for (let i = 0; i < pos.count; i++) { const x = base[i * 3]; pos.setZ(i, Math.sin(x * 3 + t * 4) * 0.12 * (x + 0.8)); } pos.needsUpdate = true; geo.computeVertexNormals(); g.rotation.y = -0.4; }; }),
  tree: scene((g) => { const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.7, 6), mat(0x8a6446)); trunk.position.y = -0.7; g.add(trunk); const a = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.0, 7), mat(0x5aa86a)); a.position.y = -0.05; g.add(a); const b = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.8, 7), mat(0x6bbd78)); b.position.y = 0.5; g.add(b); return (t) => { g.rotation.set(0.15, t * 0.4, Math.sin(t * 1.3) * 0.05); }; }),
  arrow: scene((g) => { const ring = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.12, 6, 28, Math.PI * 1.6), mat(0x5b8def)); g.add(ring); const tip = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.5, 6), mat(0x5b8def)); tip.position.set(0.85 * Math.cos(Math.PI * 1.6), 0.85 * Math.sin(Math.PI * 1.6), 0); tip.rotation.z = Math.PI * 1.6; g.add(tip); return (t, w) => { g.rotation.set(0.9, 0, -w.heading * Math.PI / 180); }; }),
  hex: scene((g) => { const discs = []; const geo = new THREE.CylinderGeometry(0.3, 0.3, 0.16, 18); const pts = [[0, 0]].concat([0, 1, 2, 3, 4, 5].map((i) => [0.78 * Math.cos(i * Math.PI / 3), 0.78 * Math.sin(i * Math.PI / 3)])); for (const [x, z] of pts) { const d = new THREE.Mesh(geo, mat(0x3fb3a3)); d.position.set(x, 0, z); g.add(d); discs.push(d); } return (t, w) => { const ph = ((w.x * 0.08 + w.y * 0.05) % 1 + 1) % 1, on = Math.floor(ph * 7) % 7; discs.forEach((d, i) => { d.position.y = i === on ? 0.14 : 0; d.material.color.setHex(i === on ? 0x7fe0cf : 0x3fb3a3); }); g.rotation.set(0.95, 0.3, 0); }; }),
  gauge: scene((g) => { const dial = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.15, 20, 1, false, 0, Math.PI), mat(0xb9c0cc)); dial.rotation.set(Math.PI / 2, Math.PI / 2, 0); g.add(dial); const needle = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.85, 0.08), mat(0xe25a4a)); needle.geometry.translate(0, 0.42, 0); needle.position.z = 0.12; g.add(needle); return (t, w) => { needle.rotation.z = Math.PI / 2 - w.speed * Math.PI; g.position.y = -0.35; }; }),
};
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0.2, 5.6); cam.lookAt(0, 0, 0);
function drawSymbols(t, w) {
  const r = board.getBoundingClientRect(); renderer.setSize(r.width, r.height, false);
  renderer.setScissorTest(false); renderer.clear(); renderer.setScissorTest(true);
  const draw = (sym, cx, cy, size) => { if (size < 8) return; const x = cx - size / 2, y = r.height - cy - size / 2; renderer.setViewport(x, y, size, size); renderer.setScissor(x, y, size, size); cam.aspect = 1; cam.updateProjectionMatrix(); SYM[sym].upd(t, w); renderer.render(SYM[sym].s, cam); };

  for (const [id, p] of P) if (p.kind === 'in') draw(SENSES.find((q) => q.id === id.split(':')[1]).sym, p.x, p.y, R * 1.6);
}

// ---- the learning rule, always on screen (mock-up numbers from the replay) ----
const TRAINERS = {
  evolution: { n: 'Evolution', eq: 'w′ = w + σ·ε<br>the fittest 4 of 64 breed' },
  backprop: { n: 'Backprop', eq: 'Δw = η · δ · x<br>δ<sub>out</sub> = (t − y)·f′(z)<br>δ<sub>hidden</sub> = f′(z)·Σ w·δ' },
  ac: { n: 'Actor-critic', eq: 'δ = r + γ·V(s′) − V(s)<br>Δw = α · δ · ∂log π/∂w' },
  arp: { n: 'A<sub>RP</sub>', eq: 'reward: Δw = ρ·(y − p)·x<br>penalty: Δw = λρ·(−y − p)·x' },
};
const dF = (fn, y) => fn === 'tanh' ? 1 - y * y : fn === 'sigmoid' ? y * (1 - y) : fn === 'relu' ? (y > 0 ? 1 : 0) : 0;
const label = (id) => id.startsWith('i:') ? (() => { const [, sid, k] = id.split(':'), s = SENSES.find((q) => q.id === sid); const tg = s.tag(+k, S.count[sid]); return `${s.name.replace(/ cells$/, '')}${tg ? ` (${tg})` : ''}`; })() : id.startsWith('o:') ? WHEELS.find((w) => w.id === id).label + ' wheel' : `layer ${depth(id)} neuron ${+id.split(':')[1] + 1}`;
function buildTrainers() { $('trainers').innerHTML = Object.entries(TRAINERS).map(([k, v]) => `<button type="button" data-tr="${k}" aria-pressed="${S.trainer === k}">${v.n}</button>`).join(''); $('trainers').querySelectorAll('[data-tr]').forEach((b) => b.onclick = () => { if (b.dataset.tr !== 'evolution' && S.layers.some((l) => l.fn === 'step')) return toast(`${TRAINERS[b.dataset.tr].n.replace(/<[^>]+>/g, '')} needs a slope to follow; a step layer has none. Change it first.`); S.trainer = b.dataset.tr; buildTrainers(); }); $('eq').innerHTML = TRAINERS[S.trainer].eq; }
let ruleT = 0;
function showRule(act, t) {
  ruleT += 1; if (ruleT % 12) return;

  L[L.length - 1].forEach((id, j) => { const y = act.get(id) ?? 0, target = Math.tanh(Math.sin(t * 0.8 + j)); delta.set(id, (target - y) * (1 - y * y)); });
  for (let i = L.length - 2; i >= 1; i--) for (const a of L[i]) { let s = 0; for (const [x, b, w] of W) if (x === a) s += w * (delta.get(b) ?? 0); delta.set(a, dF(S.layers[i - 1].fn, act.get(a) ?? 0) * s); }
  let best = null;
  for (const [a, b, w] of W) {
    const x = act.get(a) ?? 0, d = delta.get(b) ?? 0;
    const dw = tr === 'backprop' ? 0.05 * d * x : tr === 'ac' ? 0.02 * (0.1 + 0.4 * Math.sin(t * 0.9)) * d * x : tr === 'arp' ? (r ? 0.1 * (Math.sign(Math.sin(t * 3 + w)) - Math.tanh(act.get(b) ?? 0)) * x : 0.05 * (-Math.sign(Math.sin(t * 3 + w)) - Math.tanh(act.get(b) ?? 0)) * x) : 0.2 * Math.sin(t * 2.3 + w * 7) * 0.4;
    if (!best || Math.abs(dw) > Math.abs(best.dw)) best = { a, b, w, x, d, dw };
  }
  if (!best) return;
  const f = (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(3);
  const line = tr === 'backprop' ? `0.05 × ${f(best.d)} × ${f(best.x)} = <b>${f(best.dw)}</b>`
    : tr === 'ac' ? `δ = ${f(0.1 + 0.4 * Math.sin(t * 0.9))} (${r ? 'progress' : 'wall'}) · Δw = <b>${f(best.dw)}</b>`
    : tr === 'arp' ? `${r ? 'reward' : 'penalty'} · Δw = <b>${f(best.dw)}</b>` : `σ = 0.21 · this wire: <b>${f(best.dw)}</b>`;
  $('nums').innerHTML = `${label(best.a)} → ${label(best.b)}<br>${line}`;
  const p = P.get(best.a), q = P.get(best.b), hl = svg.querySelector('#ruleWire');
  if (p && q && hl) { const x1 = p.x + (p.kind === 'in' ? R : 16), x2 = q.x - (q.kind === 'out' ? 13 : 16), dx = x2 - x1; hl.setAttribute('d', `M ${x1} ${p.y} C ${x1 + dx * .45} ${p.y}, ${x2 - dx * .45} ${q.y}, ${x2} ${q.y}`); }
}

// ---- the always-running loop ----
const flash = new Map(), phase = new Map();
let last = performance.now(), simT = 8;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; simT += dt;
  const w = world(simT), act = forward(w);
  for (const [id, v] of act) {
    const node = svg.querySelector(`[data-spk="${CSS.escape(id)}"]`); if (!node) continue;
    const rate = rateOf(id, v);
    if (reduce) node.setAttribute('opacity', (rate * 0.85).toFixed(2));
    else { let ph = (phase.get(id) ?? Math.random()) + rate * MAX_HZ * dt, fl = flash.get(id) ?? 0; if (ph >= 1) { ph -= Math.floor(ph); fl = 1; } fl = Math.max(0, fl - dt * 9); phase.set(id, ph); flash.set(id, fl); node.setAttribute('opacity', fl.toFixed(2)); }
    if (id.startsWith('o:')) { const p = P.get(id), a = svg.querySelector(`[data-arrow="${CSS.escape(id)}"]`); if (a && p) { const sp = v, s = Math.sign(sp || 1), x0 = p.x + 18 * s; a.setAttribute('d', Math.abs(sp) < 0.05 ? '' : `M ${x0} ${p.y} h ${24 * sp} l ${-5 * s} -4 m ${5 * s} 4 l ${-5 * s} 4`); } }
  }
  showRule(act, simT);
  drawSymbols(simT, w);
  requestAnimationFrame(frame);
}
addEventListener('resize', render);
buildTray(); buildTrainers(); render(); requestAnimationFrame(frame);
</script>
